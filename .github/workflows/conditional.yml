name: Conditional

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Kies de omgeving"
        required: true
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - name: Production deploy
        if: github.event.inputs.environment == 'production'
        run: echo "Deploying to production!"

      - name: Test mode
        if: github.event.inputs.environment == 'development' || github.event.inputs.environment == 'staging'
        run: echo "Running in test mode"

      - name: Toon gekozen environment
        if: always()
        run: echo "Gekozen environment is $ENVIRONMENT"
